name: Weekly MOO19 NFT Report & Newsletter Automation

on:
  schedule:
    # Runs every Monday at 9:00 AM EDT (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web UI

jobs:
  build-generate-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Diagnostic - List Repository Files
        run: |
          echo "=== Current Repository Files ==="
          ls -la

      - name: Copy Subfolder Scripts to Root (If Applicable)
        run: |
          if [ -d "github_repository_files" ]; then
            echo "[*] Copying scripts from github_repository_files/ to root..."
            cp -r github_repository_files/* . || true
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          else
            pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib || true
          fi

      - name: Ensure Output Directory Exists
        run: |
          mkdir -p output/bumpers output/standalone_clips

      - name: Run NFT Report Agent
        run: |
          if [ -f nft_report_agent.py ]; then
            echo "[*] Running nft_report_agent.py..."
            python nft_report_agent.py --run --output-dir output
          else
            echo "[!] Error: nft_report_agent.py not found in repository."
            exit 1
          fi

      - name: Run Newsletter Agent
        run: |
          if [ -f newsletter_agent.py ]; then
            echo "[*] Running newsletter_agent.py..."
            python newsletter_agent.py --run --output-dir output
          else
            echo "[!] Error: newsletter_agent.py not found in repository."
            exit 1
          fi

      - name: Upload Build Artifact Bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekly-nft-report-bundle
          path: output/

      - name: Commit and Push Updated Episode Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate weekly NFT Report and Newsletter [$(date +'%Y-%m-%d')]"
          git push || echo "[*] Push skipped or already up to date."

      - name: Sync Output Files Directly to Google Drive
        if: env.GDRIVE_CREDENTIALS != ''
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > gdrive_credentials.json
          if [ -f sync_to_gdrive.py ]; then
            python sync_to_gdrive.py || true
          fi
          rm -f gdrive_credentials.json
