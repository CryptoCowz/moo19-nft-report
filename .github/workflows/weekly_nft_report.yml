                      "text_prompt": f"2D cel-shaded cartoon news broadcast, Newsroom01_Large copy.jpg background plate with curved wooden news desk. Spoken audio line: '\''{script_text}'\''",
                      "voice_prompt": script_text,
                      "speech": script_text,
                      "character_references": chars,
                      "gui_overlays": overlays
                  }
                  manifest_data["clips"].append(clip_obj)
                  
                  clip_filename = f"{cid}_{title.lower().replace(' ', '_').replace(':', '')}.json"
                  with open(f"output/standalone_clips/{clip_filename}", "w") as cf:
                      json.dump(clip_obj, cf, indent=2)

              with open("output/google_flow_animation_manifest.json", "w") as mf:
                  json.dump(manifest_data, mf, indent=2)

              print("[✓] All Scripts, Manifests, and 13 Standalone Clips generated successfully!")

          if os.path.exists("newsletter_agent.py"):
