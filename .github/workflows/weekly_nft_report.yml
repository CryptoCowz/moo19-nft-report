name: Weekly MOO19 NFT Report & Newsletter Automation

on:
  schedule:
    # Runs every Monday at 9:00 AM EDT (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web UI

jobs:
  build-generate-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inspect Workspace Files
        run: |
          echo "=== Root Directory Listing ==="
          ls -la

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f github_repository_files/requirements.txt ]; then
            pip install -r github_repository_files/requirements.txt
          else
            pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
          fi

      - name: Run NFT Report Agent
        run: |
          if [ -f nft_report_agent.py ]; then
            python nft_report_agent.py --run --output-dir output
          elif [ -f github_repository_files/nft_report_agent.py ]; then
            python github_repository_files/nft_report_agent.py --run --output-dir output
          else
            echo "Searching for nft_report_agent.py..."
            SCRIPT_PATH=$(find . -name "nft_report_agent.py" | head -n 1)
            python "$SCRIPT_PATH" --run --output-dir output
          fi

      - name: Run Newsletter Agent
        run: |
          if [ -f newsletter_agent.py ]; then
            python newsletter_agent.py --run --output-dir output
          elif [ -f github_repository_files/newsletter_agent.py ]; then
            python github_repository_files/newsletter_agent.py --run --output-dir output
          else
            echo "Searching for newsletter_agent.py..."
            SCRIPT_PATH=$(find . -name "newsletter_agent.py" | head -n 1)
            python "$SCRIPT_PATH" --run --output-dir output
          fi

      - name: Upload Build Artifact Bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekly-nft-report-bundle
          path: output/

      - name: Commit and Push Updated Episode Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          git commit -m "Auto-generate weekly NFT Report and Newsletter [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push || true

      - name: Sync Output Files Directly to Google Drive
        if: env.GDRIVE_CREDENTIALS != ''
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > gdrive_credentials.json
          if [ -f sync_to_gdrive.py ]; then
            python sync_to_gdrive.py
          elif [ -f github_repository_files/sync_to_gdrive.py ]; then
            python github_repository_files/sync_to_gdrive.py
          fi
          rm -f gdrive_credentials.json
