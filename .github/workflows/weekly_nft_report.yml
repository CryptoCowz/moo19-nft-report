              clips_info = [
                  ("clip_001", "Clip 01: Studio Intro", "Daisy M. (Minty) Ledger: Welcome back to MOO19 News! Today on the NFT Report, we'\''re reviewing top digital flexes! Professor Hartmut von Schnurrbart: And check your screen for Cow-pedia Pop-ups and Scam or Stampede Checks! Let me examine the code!", ["Daisy M. (Minty) Ledger", "Professor Hartmut von Schnurrbart"], {}),
