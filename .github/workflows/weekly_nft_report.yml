                          "type": "2D_BACKGROUND_PLATE"
                      },
                      "character_references": [
                          {"character_id": "CELEBRITY_REPORTER", "character_name": "Daisy M. (Minty) Ledger", "file_name": "CelebReporter_2k.png", "layer_position": {"x_percent": 18, "y_percent": 30, "scale": 1.0}},
                          {"character_id": "SCIENCE_REPORTER", "character_name": "Professor Hartmut von Schnurrbart", "file_name": "ScienceReporter_2k.png", "layer_position": {"x_percent": 68, "y_percent": 30, "scale": 1.0}}
                      ]
                  },
