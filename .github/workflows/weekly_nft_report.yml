                  "target_model": "Omni Flash (10s Dialogue Clips & 4s Bumpers)",
                  "clip_duration_seconds": 10,
                  "bumper_duration_seconds": 4,
                  "total_duration_seconds": 150,
                  "master_assets": {
                      "environment": {
