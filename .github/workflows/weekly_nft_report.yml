name: Weekly MOO19 NFT Report & Newsletter Automation

on:
  schedule:
    # Runs every Monday at 9:00 AM EDT (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web UI

jobs:
  build-generate-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Diagnostic - Inspect Files
        run: |
          echo "=== 1. Inspecting Repository Workspace ==="
          ls -la
          echo "=========================================="

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib || true

      - name: Prepare Directories and Scripts
        run: |
          mkdir -p output/bumpers output/standalone_clips

          # If scripts are in a subfolder, copy them to root
          if [ -d "github_repository_files" ]; then
            echo "[*] Copying files from github_repository_files/ to root..."
            cp -r github_repository_files/* . || true
          fi

      - name: Execute MOO19 Production Agents
        run: |
          echo "=== Executing NFT Report Agent ==="
          if [ -f "nft_report_agent.py" ] && [ -s "nft_report_agent.py" ]; then
            python nft_report_agent.py --run --output-dir output
          else
            echo "[!] Error: nft_report_agent.py missing. Please ensure nft_report_agent.py is created in the repository root."
            exit 1
          fi

          echo "=== Executing Newsletter Agent ==="
          if [ -f "newsletter_agent.py" ] && [ -s "newsletter_agent.py" ]; then
            python newsletter_agent.py --run --output-dir output
          else
            echo "[!] Error: newsletter_agent.py missing. Please ensure newsletter_agent.py is created in the repository root."
            exit 1
          fi

      - name: Upload Output Artifact Bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekly-nft-report-bundle
          path: output/

      - name: Commit and Push Updated Episode Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          git diff --staged --quiet || git commit -m "Auto-generate weekly NFT Report and Newsletter [$(date +'%Y-%m-%d')]"
          git push || echo "[*] Git push skipped or no write permissions."

      - name: Sync Output Files Directly to Google Drive
        if: env.GDRIVE_CREDENTIALS != ''
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > gdrive_credentials.json
          if [ -f "sync_to_gdrive.py" ]; then
            python sync_to_gdrive.py || true
          fi
          rm -f gdrive_credentials.json
