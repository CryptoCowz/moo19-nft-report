name: Weekly MOO19 NFT Report & Newsletter Automation

on:
  schedule:
    # Runs every Monday at 9:00 AM EDT (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web UI

permissions:
  contents: write

jobs:
  build-generate-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib || true

      - name: Run Production Engine (generate_all.py)
        run: |
          python generate_all.py --output-dir output

      - name: Upload Output Artifact Bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekly-nft-report-bundle
          path: output/
          if-no-files-found: warn

      - name: Commit and Push Output to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-generate weekly NFT Report and Newsletter [$(date +'%Y-%m-%d')]" || true
            git push origin main || git push || echo "[*] Push skipped or requires token write permission."
          else
            echo "[*] No file changes to commit."
          fi

      - name: Sync Output Files Directly to Google Drive
        if: env.GDRIVE_CREDENTIALS != ''
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > gdrive_credentials.json
          if [ -f "sync_to_gdrive.py" ]; then
            python sync_to_gdrive.py || echo "[*] Google Drive sync step completed."
          fi
          rm -f gdrive_credentials.json
