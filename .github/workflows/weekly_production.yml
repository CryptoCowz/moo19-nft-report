name: Generate MOO19 Clips & Bumpers JSON

on:
  schedule:
    # Runs automatically every Monday at 9:00 AM EDT (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Enables 1-click manual trigger from the GitHub Actions tab

jobs:
  generate-clips-and-bumps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Generation Engine
        run: |
          mkdir -p output/bumpers output/standalone_clips
          if [ -f "generate_all.py" ]; then
            echo "[*] Running generate_all.py..."
            python generate_all.py
          elif [ -f "nft_report_agent.py" ]; then
            echo "[*] Running nft_report_agent.py..."
            python nft_report_agent.py --run --output-dir output
          else
            echo "[!] Generator script not found in repository root."
            exit 1
          fi

      - name: Organize Clips and Bumps JSON Files
        run: |
          mkdir -p clips bumpers
          if [ -d "output/standalone_clips" ]; then
            cp output/standalone_clips/*.json clips/ 2>/dev/null || true
          fi
          if [ -d "output/bumpers" ]; then
            cp output/bumpers/*.json bumpers/ 2>/dev/null || true
          fi
          if [ -f "output/google_flow_animation_manifest.json" ]; then
            cp output/google_flow_animation_manifest.json ./
          fi
          echo "=== Clips JSON Files ==="
          ls -la clips/
          echo "=== Bumpers JSON Files ==="
          ls -la bumpers/

      - name: Upload JSON Artifacts Bundle
        uses: actions/upload-artifact@v4
        with:
          name: moo19-clips-and-bumpers-json
          path: |
            clips/
            bumpers/
            google_flow_animation_manifest.json
            episode_history.json
          if-no-files-found: warn

      - name: Commit and Push JSON Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clips/ bumpers/ *.json episode_history.json || true
          if git diff --staged --quiet; then
            echo "[*] No new JSON changes to commit."
          else
            git commit -m "Generate MOO19 clips and bumpers JSON files [$(date +'%Y-%m-%d')]"
            git push origin main || git push || echo "[!] Push skipped or write permissions restricted in repository settings."
          fi
